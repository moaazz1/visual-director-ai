name: Deploy to Hugging Face Space
on:
  workflow_dispatch:
    inputs:
      space:
        description: Hugging Face Space ID (username/space-name)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install 'huggingface_hub>=1,<2'
      - name: Upload source to the existing Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ inputs.space }}
        run: |
          python - <<'PY'
          import os
          import re
          from huggingface_hub import HfApi

          space = os.environ["SPACE_ID"]
          if not re.fullmatch(r"[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+", space):
              raise SystemExit("Enter a Space ID in username/space-name form.")
          if not os.environ.get("HF_TOKEN"):
              raise SystemExit("Add the HF_TOKEN repository secret before running this workflow.")
          api = HfApi()
          api.repo_info(space, repo_type="space")
          api.upload_folder(
              repo_id=space, repo_type="space", folder_path=".",
              allow_patterns=["README.md", "Dockerfile", ".dockerignore", "requirements.txt", "deploy/*", "api/*", "web/*"],
          )
          PY
